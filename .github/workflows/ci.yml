name: ci

# The kit's own checks on every pull request and push to main, run through the kit's shared kit-ci.yml (so every
# change also proves it): fmt, clippy, tests (the token tests prove the generated themes equal Encore's), that
# design/out is up to date and the contracts parse; the web components (kit-leptos) and their demo are checked
# and linted for wasm32. `workflows` lints every workflow file with actionlint (and
# shellcheck on their scripts). Required to pass before a merge.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    uses: ./.github/workflows/kit-ci.yml
    with:
      rust-dirs: .
      wasm-dirs: |
        crates/kit-leptos
        crates/kit-leptos/demo
      fmt: true
      check: |
        set -e
        echo "::group::Generated themes are up to date"
        cargo run -p kit-tokens --locked -- --check
        echo "::endgroup::"
        echo "::group::Contracts parse"
        python3 -c "import yaml; yaml.safe_load(open('contracts/openapi.yaml'))"
        echo "::endgroup::"

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint (with shellcheck)
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color
