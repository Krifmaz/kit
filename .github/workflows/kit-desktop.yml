name: kit-desktop

# An app's desktop installers for Windows, Linux and macOS. Each system runs the app's tests (not on the Mac, to
# save its 10× minutes), then the app's own `package` command, checks that the files the app's updater looks for
# were made, and uploads them as the artifact <app-name>-desktop-<OS>, which kit-release attaches to the release
# (and SHA256SUMS covers).
#
# `package` is a bash command run at the repository root (Git Bash on Windows) with these variables set:
#   V         the version that names the files (the release's, or dev.<run number> on a manual run)
#   RELEASE   true for a release (build the app as V, so its updater compares the right number), false otherwise
#   FEATURES  this system's Cargo features (<os>-features)
#   ARGS      this system's extra arguments (<os>-args)
#   OUT       the folder the files go to (out)
# e.g.  package: bash scripts/package.sh --version "$V" --features "$FEATURES" $ARGS --out "$OUT"
#
# Signing is optional, from secrets the caller passes (without them the .exe is unsigned and the .app is signed
# ad hoc – macOS then asks for System Settings → Privacy & Security → Open Anyway the first time):
#   Windows: windows-cert-pfx-base64, windows-cert-password (→ WINDOWS_CERT_PFX path, WINDOWS_CERT_PASSWORD)
#   macOS:   macos-cert-p12-base64, macos-cert-password, macos-sign-identity (→ MACOS_SIGN_IDENTITY); apple-id,
#            apple-team-id and apple-app-password (→ APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD) to notarize
#
#   desktop:
#     needs: prepare
#     uses: Krifmaz/kit/.github/workflows/kit-desktop.yml@v0.1.0
#     with:
#       app-name: Notes
#       version: ${{ needs.prepare.outputs.version }}
#       project-dir: desktop
#       package: bash scripts/package.sh "$V" "$OUT"
#       linux-files: "Notes-{V}-linux-x86_64.AppImage"
#       windows-files: "Notes-{V}-windows-x86_64.exe"
#       macos-files: "Notes-{V}-macos-universal.dmg"
on:
  workflow_call:
    inputs:
      app-name:
        type: string
        required: true
      version:
        description: "The release's version (empty: a manual build, dev.<run number>, keeping Cargo.toml's version)"
        type: string
        required: false
        default: ""
      systems:
        description: "Which systems to build: all, or a space-separated list of linux, windows, macos"
        type: string
        required: false
        default: all
      ref:
        description: "The commit, branch or tag to build (empty: the one this run is on)"
        type: string
        required: false
        default: ""
      project-dir:
        description: "The desktop app's Cargo project (tests, cache)"
        type: string
        required: true
      package:
        description: "The bash command that builds and packages the app into $OUT (see the top of this file)"
        type: string
        required: true
      linux-runner:
        type: string
        required: false
        default: ubuntu-latest
      windows-runner:
        type: string
        required: false
        default: windows-latest
      macos-runner:
        type: string
        required: false
        default: macos-latest
      linux-features:
        type: string
        required: false
        default: ""
      windows-features:
        type: string
        required: false
        default: ""
      macos-features:
        type: string
        required: false
        default: ""
      linux-args:
        description: "Extra arguments for the package command on Linux ($ARGS)"
        type: string
        required: false
        default: ""
      windows-args:
        type: string
        required: false
        default: ""
      macos-args:
        type: string
        required: false
        default: ""
      linux-packages:
        description: "apt packages the Linux build needs"
        type: string
        required: false
        default: "libxkbcommon-dev libwayland-dev pkg-config file"
      linux-check:
        description: "A packaging check run on Linux before the tests (bash, repository root)"
        type: string
        required: false
        default: ""
      nsis:
        description: "Install NSIS on Windows (for an .exe installer)"
        type: boolean
        required: false
        default: false
      linux-files:
        description: "Files the Linux build must make, space-separated; {V} is the version"
        type: string
        required: false
        default: ""
      windows-files:
        type: string
        required: false
        default: ""
      macos-files:
        type: string
        required: false
        default: ""
    secrets:
      windows-cert-pfx-base64:
        required: false
      windows-cert-password:
        required: false
      macos-cert-p12-base64:
        required: false
      macos-cert-password:
        required: false
      macos-sign-identity:
        required: false
      apple-id:
        required: false
      apple-team-id:
        required: false
      apple-app-password:
        required: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          SYSTEMS: ${{ inputs.systems }}
          LINUX_OS: ${{ inputs.linux-runner }}
          LINUX_FEATURES: ${{ inputs.linux-features }}
          LINUX_ARGS: ${{ inputs.linux-args }}
          LINUX_FILES: ${{ inputs.linux-files }}
          WINDOWS_OS: ${{ inputs.windows-runner }}
          WINDOWS_FEATURES: ${{ inputs.windows-features }}
          WINDOWS_ARGS: ${{ inputs.windows-args }}
          WINDOWS_FILES: ${{ inputs.windows-files }}
          MACOS_OS: ${{ inputs.macos-runner }}
          MACOS_FEATURES: ${{ inputs.macos-features }}
          MACOS_ARGS: ${{ inputs.macos-args }}
          MACOS_FILES: ${{ inputs.macos-files }}
        run: |
          want() { [ "$SYSTEMS" = all ] || [[ " $SYSTEMS " == *" $1 "* ]]; }
          entry() { jq -nc --arg os "$1" --arg features "$2" --arg args "$3" --arg files "$4" '{os: $os, features: $features, args: $args, files: $files}'; }
          M="[]"
          add() { M=$(jq -c --argjson e "$1" '. + [$e]' <<< "$M"); }
          if want linux; then add "$(entry "$LINUX_OS" "$LINUX_FEATURES" "$LINUX_ARGS" "$LINUX_FILES")"; fi
          if want windows; then add "$(entry "$WINDOWS_OS" "$WINDOWS_FEATURES" "$WINDOWS_ARGS" "$WINDOWS_FILES")"; fi
          if want macos; then add "$(entry "$MACOS_OS" "$MACOS_FEATURES" "$MACOS_ARGS" "$MACOS_FILES")"; fi
          [ "$M" != "[]" ] || { echo "::error::no system to build (systems: $SYSTEMS)"; exit 1; }
          echo "matrix=$M" >> "$GITHUB_OUTPUT"
          echo "$M"

  desktop:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      # V names the files (dev.<run number> on a manual run)
      V: ${{ inputs.version || format('dev.{0}', github.run_number) }}
      IS_RELEASE: ${{ inputs.version != '' }}
      # the test build without debug info: several GB smaller, so the rust-cache entries of the three systems do not
      # push the other caches out of the repository's 10 GB (panics still name file and line)
      CARGO_PROFILE_DEV_DEBUG: 0
      # whether the optional signing secrets exist (a step's `if` cannot read `secrets` directly)
      HAS_WINDOWS_CERT: ${{ secrets.windows-cert-pfx-base64 != '' }}
      HAS_MACOS_CERT: ${{ secrets.macos-cert-p12-base64 != '' }}
    steps:
      - name: LF line ends (Windows)
        # Git for Windows would check the scripts out with CRLF line ends, which bash cannot run
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.project-dir }}
          key: desktop
      - name: System packages (Linux)
        if: runner.os == 'Linux' && inputs.linux-packages != ''
        env:
          PKGS: ${{ inputs.linux-packages }}
        run: |
          read -ra list <<< "$PKGS"
          sudo apt-get update && sudo apt-get install -y "${list[@]}"
      - name: Packaging checks (Linux)
        if: runner.os == 'Linux' && inputs.linux-check != ''
        env:
          SCRIPT: ${{ inputs.linux-check }}
        run: bash -c "$SCRIPT"
      - name: NSIS (Windows)
        if: runner.os == 'Windows' && inputs.nsis
        shell: bash
        run: command -v makensis >/dev/null || [ -f "/c/Program Files (x86)/NSIS/makensis.exe" ] || choco install nsis -y --no-progress
      - name: Tests
        # on Linux and Windows; the Mac skips them to save its 10× minutes (the release build below still compiles
        # all of its code)
        if: runner.os != 'macOS'
        working-directory: ${{ inputs.project-dir }}
        run: cargo test --locked
      - name: Signing certificate (Windows)
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERT == 'true'
        shell: bash
        env:
          PFX: ${{ secrets.windows-cert-pfx-base64 }}
        run: |
          F="$(cygpath -u "$RUNNER_TEMP")/kit-sign.pfx"
          printf '%s' "$PFX" | base64 -d > "$F" || { echo "::error::WINDOWS_CERT_PFX_BASE64 is not valid base64"; exit 1; }
          echo "WINDOWS_CERT_PFX=$F" >> "$GITHUB_ENV"
      - name: Signing certificate (macOS)
        if: runner.os == 'macOS' && env.HAS_MACOS_CERT == 'true'
        env:
          MACOS_CERT: ${{ secrets.macos-cert-p12-base64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.macos-cert-password }}
        run: |
          set -euo pipefail
          P12="$RUNNER_TEMP/kit-sign.p12"
          printf '%s' "$MACOS_CERT" | base64 --decode > "$P12"
          security create-keychain -p ci kit-build.keychain
          security default-keychain -s kit-build.keychain
          security unlock-keychain -p ci kit-build.keychain
          # a new keychain locks itself after 5 idle minutes, long before the two release builds reach codesign
          security set-keychain-settings -lut 21600 kit-build.keychain
          security import "$P12" -k kit-build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci kit-build.keychain
          rm -f "$P12"
      - name: Build and package
        shell: bash
        env:
          PACKAGE: ${{ inputs.package }}
          OUT: out
          FEATURES: ${{ matrix.features }}
          ARGS: ${{ matrix.args }}
          FILES: ${{ matrix.files }}
          WINDOWS_CERT_PASSWORD: ${{ env.HAS_WINDOWS_CERT == 'true' && secrets.windows-cert-password || '' }}
          MACOS_SIGN_IDENTITY: ${{ env.HAS_MACOS_CERT == 'true' && secrets.macos-sign-identity || '' }}
          APPLE_ID: ${{ env.HAS_MACOS_CERT == 'true' && secrets.apple-id || '' }}
          APPLE_TEAM_ID: ${{ env.HAS_MACOS_CERT == 'true' && secrets.apple-team-id || '' }}
          APPLE_APP_PASSWORD: ${{ env.HAS_MACOS_CERT == 'true' && secrets.apple-app-password || '' }}
        run: |
          export RELEASE="$IS_RELEASE"
          mkdir -p "$OUT"
          bash -c "$PACKAGE"
          # the names the app's updater looks for
          for f in ${FILES//\{V\}/$V}; do
            [ -s "out/$f" ] || { echo "::error::out/$f was not made"; ls -la out; exit 1; }
          done
      - name: Remove signing keys
        if: always()
        shell: bash
        run: |
          rm -f "${WINDOWS_CERT_PFX:-/nonexistent}"
          if [ "$RUNNER_OS" = macOS ]; then security delete-keychain kit-build.keychain 2>/dev/null || true; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app-name }}-desktop-${{ runner.os }}
          path: out/*
          if-no-files-found: error
