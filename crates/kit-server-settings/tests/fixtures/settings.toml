# A small settings table for a made-up demo app, for the crate's tests.

[sections.general]
title = "General"
aliases = ["main"]

[sections.storage]
title = "Storage"

[sections.extras]
title = "Extras"

[groups.general]
section = "general"
title = "General"
desc = "Your server's name."

[groups.files]
section = "storage"
title = "Files"
test = "files"
test_label = "Test connection"

[keys.app_name]
env = "APP_NAME"
default = "Demo"
group = "general"
label = "App name"

[keys.session_days]
default = 30
group = "general"
label = "Days signed in"
unit = "days"
min = 1
max = 365

[keys.rate]
default = 1.0
group = "general"
label = "Rate"
step = 0.1

[keys.storage]
default = "local"
type = "select"
options = [["local", "This server"], ["s3", "S3 bucket"]]
group = "files"
label = "Where files go"

[keys.s3_secret]
env = "DEMO_S3_SECRET"
default = ""
secret = true
group = "files"
label = "S3 secret key"
when = "storage=s3"

[keys.api_key]
default = ""
secret = true
help = "The server's API key."

[keys.auto_approve]
default = false

[keys.zz_limit]
default = 1
