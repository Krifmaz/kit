# A small settings table in Encore's form, for the crate's tests.
listed_last = ["late_key"]

[sections.general]
title = "General"
aliases = ["main"]

[sections.downloads]
title = "Downloads"

[sections.blocked]
title = "Blocked"

[groups.general]
section = "general"
title = "General"
desc = "Your server's name."

[groups.torznab]
section = "downloads"
title = "Torrents"
test = "torznab"
test_label = "Test connection"

[keys.app_name]
env = "APP_NAME"
default = "Encore"
group = "general"
label = "App name"

[keys.session_days]
default = 30
group = "general"
label = "Days signed in"
unit = "days"
min = 1
max = 365

[keys.rate]
default = 1.0
group = "general"
label = "Rate"
step = 0.1

[keys.torrent_client]
default = "qbittorrent"
type = "select"
options = [["qbittorrent", "qBittorrent"], ["deluge", "Deluge"]]
group = "torznab"
label = "Torrent client"

[keys.qbit_password]
env = "QBIT_PASSWORD"
default = ""
secret = true
group = "torznab"
label = "qBittorrent password"
when = "torrent_client=qbittorrent"

[keys.api_key]
default = ""
secret = true
help = "The server's API key."

[keys.auto_approve]
default = false

[keys.late_key]
default = 1
