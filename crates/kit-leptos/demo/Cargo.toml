[package]
name = "kit-leptos-demo"
description = "Every kit-leptos component on one page with fake data for a neutral app, with a theme switcher and an in-page check of the DOM against the kit's own markup."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.88"
publish = false

[dependencies]
kit-leptos = { path = ".." }
kit-rules = { path = "../../kit-rules" }
leptos = { workspace = true, features = ["csr"] }
serde = { workspace = true }
serde_json = "1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlElement", "HtmlTemplateElement", "DocumentFragment", "Node", "NodeList", "Window"] }

[lints]
workspace = true
