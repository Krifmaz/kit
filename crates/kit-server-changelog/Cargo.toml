[package]
name = "kit-server-changelog"
description = "What's new: an app's release notes (a folder of <version>.md, or a list) for the popup after an update and the full changelog, with per-account seen tracking, the popup switch and the hotfix rule."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
kit-server-core = { workspace = true, optional = true }
kit-rules = { path = "../kit-rules", optional = true }
axum = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }

[dev-dependencies]
kit-server-core = { workspace = true, features = ["testing"] }
tokio.workspace = true
tower.workspace = true

[features]
default = ["server"]
# the routes; without it the crate is only the notes parser and `build::embed`, for an app's build script
server = ["dep:kit-rules", "dep:kit-server-core", "dep:axum", "dep:serde_json"]

[lints]
workspace = true
