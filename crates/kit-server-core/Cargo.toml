[package]
name = "kit-server-core"
description = "What every kit server crate shares: the error answer, the account and admin extractors, the small database trait, version numbers, and a SQLite database for apps and tests."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
rusqlite = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true
tower.workspace = true

[features]
# `SqliteDb`: the kit's own SQLite database (one connection), for apps that have none of their own and for tests
sqlite = ["dep:rusqlite"]
# `testing::TestHost`: an app state for the crates' tests (SQLite in memory, accounts by request header)
testing = ["sqlite"]

[lints]
workspace = true
