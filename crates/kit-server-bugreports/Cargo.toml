[package]
name = "kit-server-bugreports"
description = "Bug reports with screenshots and log files, a reply thread with the admin, crash logs, and an export as a zip or one plain text file; plus the crash reports an app uploads. Paths, limits and words are the app's."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
kit-server-core.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
image.workspace = true
zip.workspace = true
urlencoding.workspace = true

[dev-dependencies]
kit-server-core = { workspace = true, features = ["testing"] }
tower.workspace = true

[features]
default = ["sqlite"]
# `SqliteReports`: the reports and crash reports in SQLite, on `kit_server_core::SqliteDb`
sqlite = ["kit-server-core/sqlite"]
# `PgReports`: the reports and crash reports in Postgres, on `kit_server_core::pg::PgDb`
postgres = ["kit-server-core/postgres"]
# `store::reports_contract` and `store::crash_contract`, for the tests of an app's own stores
testing = ["kit-server-core/testing"]

[lints]
workspace = true
