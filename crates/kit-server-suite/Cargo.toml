[package]
name = "kit-server-suite"
description = "Suite for a kit server: the app's manifest, links to other apps by address and key, one shared sidebar per person, single sign-on through an account source (OpenID Connect) and one search across linked apps."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
kit-server-core = { workspace = true, features = ["sqlite"] }
kit-rules.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio.workspace = true
futures-util.workspace = true
sha2.workspace = true
urlencoding.workspace = true
reqwest.workspace = true
hmac.workspace = true
base64.workspace = true
rand.workspace = true

[dev-dependencies]
kit-server-core = { workspace = true, features = ["testing"] }

[features]
# `PgSuite`: the links and keys in Postgres
postgres = ["kit-server-core/postgres"]

[lints]
workspace = true
