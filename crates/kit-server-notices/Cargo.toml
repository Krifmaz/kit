[package]
name = "kit-server-notices"
description = "Plain-language banners for a kit server: register notices (id, severity, one sentence), check them again on a timer and on demand, and serve them at configurable paths or inside an app's own answer."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
kit-server-core = { workspace = true, features = ["sqlite"] }
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio.workspace = true
futures-util.workspace = true

[dev-dependencies]
kit-server-core = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }
tower.workspace = true

[features]
# `PgNotices`: the kept notices' last results in Postgres
postgres = ["kit-server-core/postgres"]

[lints]
workspace = true
