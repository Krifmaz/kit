openapi: 3.1.0
info:
  title: Krifmaz Kit shared endpoints
  version: 0.1.0
  license: { name: MIT }
  description: >
    The endpoints every kit server speaks. Every path is a default an app can move (each crate's `XPaths`). The prose files next to this one
    (health.md, changelog.md, notices.md, bug-reports.md, diagnostics.md, settings-schema.md, update-feed.md, suite.md)
    say what the fields mean. Apps may add fields; clients ignore fields they do not know.
components:
  schemas:
    Error:
      type: object
      required: [detail]
      properties: { detail: { type: string, description: a plain sentence, shown in full and copyable } }
    Ok:
      type: object
      required: [ok]
      properties: { ok: { type: boolean } }
    ReleaseSummary:
      type: object
      required: [version, title, summary, highlights]
      properties:
        version: { type: string }
        title: { type: string }
        summary: { type: string }
        highlights: { type: array, items: { type: string }, maxItems: 6 }
    Block:
      type: object
      required: [k]
      properties:
        k: { type: string, enum: [h, p, li, row] }
        text: { type: string }
        lead: { type: string }
        cells: { type: array, items: { type: string } }
        head: { type: boolean }
    Notice:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        text: { type: string }
        checking: { type: boolean }
        id: { type: string }
        severity: { type: string, enum: [info, warn, err] }
    BugFile:
      type: object
      properties: { id: { type: integer }, name: { type: string }, mime: { type: string }, size: { type: integer }, url: { type: string } }
    BugReportRow:
      type: object
      properties:
        id: { type: integer }
        kind: { type: string, enum: [bug, not_bug, howto, crash] }
        title: { type: string }
        status: { type: string, enum: [new, looking, fixed, wontfix, answered] }
        username: { type: string }
        user_id: { type: integer }
        created_at: { type: number }
        updated_at: { type: number }
        message_count: { type: integer }
        file_count: { type: integer }
        unread: { type: boolean }
    Check:
      type: object
      required: [name, ok]
      properties:
        name: { type: string }
        kind: { type: string, enum: [service, path, tool] }
        request: { type: string }
        ok: { type: boolean }
        detail: { type: string }
        status: { type: string, enum: [ok, warn, fail] }
        fix: { type: string }
    SuiteSection:
      type: object
      required: [id, title, path]
      properties: { id: { type: string, pattern: "^[a-z0-9-]{1,64}$" }, title: { type: string }, icon: { type: string, description: SVG path data in a 24x24 box }, path: { type: string } }
    SuiteManifest:
      type: object
      required: [kit_suite, id, name, base_url, sections]
      properties:
        kit_suite: { type: integer, const: 1 }
        id: { type: string, pattern: "^[a-z0-9-]{1,64}$" }
        name: { type: string }
        icon: { type: string }
        version: { type: string }
        base_url: { type: string }
        sections: { type: array, items: { $ref: "#/components/schemas/SuiteSection" } }
        deep_links: { type: object, additionalProperties: { type: string } }
        search: { type: [string, "null"] }
        sso: { type: [object, "null"], properties: { issuer: { type: string } } }
    SuiteLink:
      type: object
      properties:
        id: { type: integer }
        base_url: { type: string }
        name: { type: string }
        account_source: { type: boolean }
        manifest: { $ref: "#/components/schemas/SuiteManifest" }
        error: { type: [string, "null"] }
        ok: { type: boolean }
        checked_at: { type: number }
        created_at: { type: number }
    SuiteKey:
      type: object
      properties: { id: { type: string }, name: { type: string }, redirect_url: { type: [string, "null"] }, created_at: { type: number }, last_used_at: { type: number }, key: { type: string, description: only in the answer that made it } }
    SidebarItem:
      type: object
      properties:
        key: { type: string }
        app: { type: string }
        app_name: { type: string }
        section: { type: string }
        title: { type: string }
        icon: { type: string }
        url: { type: string }
        path: { type: string }
        hidden: { type: boolean }
        local: { type: boolean }
    Sidebar:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SidebarItem" } }
        apps: { type: array, items: { type: object, properties: { id: { type: string }, name: { type: string }, icon: { type: string }, base_url: { type: string }, local: { type: boolean }, error: { type: [string, "null"] } } } }
    SearchHit:
      type: object
      required: [title, url]
      properties: { title: { type: string }, subtitle: { type: [string, "null"] }, url: { type: string }, section: { type: [string, "null"] }, icon: { type: [string, "null"] } }
    SearchGroup:
      type: object
      properties:
        app: { type: string }
        app_name: { type: string }
        icon: { type: string }
        local: { type: boolean }
        results: { type: array, items: { $ref: "#/components/schemas/SearchHit" } }
        error: { type: [string, "null"] }
paths:
  /api/health:
    get:
      summary: Server version and web build
      responses:
        "200":
          description: up
          content:
            application/json:
              schema:
                type: object
                required: [ok, version, web]
                properties:
                  ok: { type: boolean, const: true }
                  version: { type: string }
                  server: { type: string }
                  web: { type: [string, "null"] }
  /api/changelog:
    get:
      summary: Every release with notes, newest first
      responses:
        "200":
          description: the changelog
          content:
            application/json:
              schema:
                type: object
                properties:
                  popup: { type: boolean }
                  releases:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/ReleaseSummary"
                        - type: object
                          properties: { blocks: { type: array, items: { $ref: "#/components/schemas/Block" } } }
  /api/changelog/new:
    get:
      summary: Releases this account has not seen
      responses:
        "200":
          description: what the popup shows
          content:
            application/json:
              schema:
                type: object
                required: [version, popup, show, releases]
                properties:
                  version: { type: string }
                  popup: { type: boolean }
                  show: { type: boolean }
                  releases: { type: array, maxItems: 4, items: { $ref: "#/components/schemas/ReleaseSummary" } }
  /api/changelog/seen:
    post:
      summary: Mark this server's version seen
      responses:
        "200":
          description: marked
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean }, seen: { type: string } } }
  /api/notices:
    get:
      summary: Every notice (default path; an app may move it)
      responses:
        "200":
          description: notices
          content:
            application/json:
              schema: { type: object, properties: { notices: { type: array, items: { $ref: "#/components/schemas/Notice" } } } }
  /api/notices/check:
    post:
      summary: Check every notice again now
      responses:
        "200":
          description: notices after the check
          content:
            application/json:
              schema: { type: object, properties: { notices: { type: array, items: { $ref: "#/components/schemas/Notice" } } } }
  /api/notices/{id}:
    get:
      summary: One notice as it reads now
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: the notice's object
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notice" }
        "404":
          description: no notice with that id
  /api/notices/{id}/check:
    post:
      summary: Check one notice again now
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: the notice after the check
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notice" }
        "404":
          description: no notice with that id
  /api/bug-reports:
    get:
      summary: List reports (a non-admin sees their own)
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: mine, in: query, schema: { type: string } }
      responses:
        "200":
          description: reports
          content:
            application/json:
              schema: { type: object, properties: { reports: { type: array, items: { $ref: "#/components/schemas/BugReportRow" } } } }
    post:
      summary: File a report
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                kind: { type: string }
                title: { type: string, maxLength: 200 }
                body: { type: string, maxLength: 20000 }
                page: { type: string }
                app_version: { type: string }
                device: { type: string }
                file: { type: array, maxItems: 6, items: { type: string, format: binary } }
      responses:
        "200":
          description: filed
          content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, id: { type: integer } } } } }
  /api/bug-reports/unread:
    get:
      summary: Reports with unread answers
      responses:
        "200": { description: count, content: { application/json: { schema: { type: object, properties: { count: { type: integer } } } } } }
  /api/bug-reports/export:
    get:
      summary: Export reports (admin) as a zip, or as one .txt with format=txt
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string } }
        - { name: ids, in: query, schema: { type: string } }
        - { name: format, in: query, schema: { type: string, enum: [txt] } }
      responses:
        "200":
          description: the export
          content:
            application/zip: { schema: { type: string, format: binary } }
            text/plain: { schema: { type: string } }
  /api/bug-reports/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get:
      summary: One report with its thread
      responses:
        "200": { description: the report, content: { application/json: { schema: { type: object, properties: { report: { type: object }, messages: { type: array, items: { type: object } } } } } } }
        "404": { description: missing or someone else's, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      summary: Delete a report (admin)
      responses:
        "200": { description: deleted, content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } } }
  /api/bug-reports/{id}/messages:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    post:
      summary: Reply in a report's thread
      responses:
        "200": { description: sent, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, id: { type: integer } } } } } }
  /api/bug-reports/{id}/status:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    post:
      summary: Set a report's status (admin)
      requestBody: { content: { application/json: { schema: { type: object, properties: { status: { type: string } } } } } }
      responses:
        "200": { description: set, content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } } }
  /api/bug-reports/{id}/files/{fid}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: fid, in: path, required: true, schema: { type: integer } }
    get:
      summary: An attached file
      responses: { "200": { description: the file } }
  /api/crash-reports:
    post:
      summary: An app's crash report
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string }
                device: { type: string }
                device_id: { type: string }
                app_version: { type: string }
                os: { type: string }
                time: { type: number }
                summary: { type: string }
                text: { type: string }
                key: { type: string }
      responses:
        "200": { description: kept, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, id: { type: integer }, duplicate: { type: boolean } } } } } }
    get:
      summary: The newest crash reports (50 by default; admin)
      responses: { "200": { description: crashes, content: { application/json: { schema: { type: object, properties: { crashes: { type: array, items: { type: object } } } } } } } }
    delete:
      summary: Clear crash reports (admin)
      responses: { "200": { description: cleared, content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } } } }
  /api/diagnostics:
    get:
      summary: Every check at once (admin)
      responses:
        "200": { description: checks, content: { application/json: { schema: { type: object, properties: { checks: { type: array, items: { $ref: "#/components/schemas/Check" } } } } } } }
  /api/diagnostics/{id}/test:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      summary: Run one check's test (admin)
      responses:
        "200": { description: result, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, message: { type: string } } } } } }
        "404": { description: Unknown check }
  /api/settings/schema:
    get:
      summary: The settings described as data (admin); see settings-schema.md
      responses: { "200": { description: the schema, content: { application/json: { schema: { type: object, properties: { sections: { type: array, items: { type: object } } } } } } } }
  /api/settings:
    get:
      summary: The settings' values with _meta (admin)
      responses: { "200": { description: values, content: { application/json: { schema: { type: object } } } } }
    put:
      summary: Save settings (admin); unknown, masked, environment-locked and app-kept values are left out
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses: { "200": { description: saved, content: { application/json: { schema: { type: object } } } } }
  /api/settings/secret/{key}:
    parameters: [{ name: key, in: path, required: true, schema: { type: string } }]
    get:
      summary: One saved setting in plain text (owner); 404 Unknown setting
      responses: { "200": { description: the value, content: { application/json: { schema: { type: object, properties: { key: { type: string }, value: { type: string } } } } } } }
  /api/update:
    get:
      summary: The server's own update (admin); see update-feed.md
      parameters: [{ name: force, in: query, schema: { type: string } }]
      responses: { "200": { description: update state, content: { application/json: { schema: { type: object } } } } }
    post:
      summary: Update the server to a release, the app's own way (admin)
      requestBody: { content: { application/json: { schema: { type: object, properties: { tag: { type: string } } } } } }
      responses: { "202": { description: started } }
  /api/restart:
    post:
      summary: Restart gracefully, exit code 75 (admin)
      responses: { "202": { description: restarting, content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } } } }
  /api/kit/manifest:
    get:
      summary: What this app is (public); see suite.md
      responses: { "200": { description: the manifest, content: { application/json: { schema: { $ref: "#/components/schemas/SuiteManifest" } } } } }
  /api/kit/suite/ping:
    get:
      summary: Whether a key works (Authorization Bearer key)
      responses: { "200": { description: this app, content: { application/json: { schema: { type: object, properties: { id: { type: string }, name: { type: string }, key: { type: string } } } } } }, "401": { description: wrong or revoked key } }
  /api/kit/search:
    get:
      summary: This app's own search (signed in, or a linked app with a key)
      parameters: [{ name: q, in: query, required: true, schema: { type: string, maxLength: 200 } }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }]
      responses: { "200": { description: hits, content: { application/json: { schema: { type: object, properties: { results: { type: array, items: { $ref: "#/components/schemas/SearchHit" } } } } } } } }
  /api/kit/suite/links:
    get:
      summary: Every linked app (admin)
      responses: { "200": { description: links, content: { application/json: { schema: { type: object, properties: { links: { type: array, items: { $ref: "#/components/schemas/SuiteLink" } } } } } } } }
    post:
      summary: Link an app by address and key (admin)
      requestBody: { content: { application/json: { schema: { type: object, required: [url, key], properties: { url: { type: string }, key: { type: string }, account_source: { type: boolean } } } } } }
      responses: { "200": { description: the link, content: { application/json: { schema: { $ref: "#/components/schemas/SuiteLink" } } } }, "400": { description: can't be linked (the reason) }, "409": { description: linked already } }
  /api/kit/suite/links/{id}:
    patch:
      summary: Make a link the account source (or not), or give it a new key (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { account_source: { type: boolean }, key: { type: string } } } } } }
      responses: { "200": { description: the link, content: { application/json: { schema: { $ref: "#/components/schemas/SuiteLink" } } } } }
    delete:
      summary: Remove a link (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: removed, content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } } } }
  /api/kit/suite/links/{id}/refresh:
    post:
      summary: Read the linked app's manifest again (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: the link, content: { application/json: { schema: { $ref: "#/components/schemas/SuiteLink" } } } } }
  /api/kit/suite/keys:
    get:
      summary: Every key this app made for other apps (admin)
      responses: { "200": { description: keys, content: { application/json: { schema: { type: object, properties: { keys: { type: array, items: { $ref: "#/components/schemas/SuiteKey" } } } } } } } }
    post:
      summary: Make a key for another app (admin); the whole key is in this answer only
      requestBody: { content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string }, redirect_url: { type: string } } } } } }
      responses: { "200": { description: the key, content: { application/json: { schema: { $ref: "#/components/schemas/SuiteKey" } } } } }
  /api/kit/suite/keys/{id}:
    delete:
      summary: Revoke a key (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: revoked, content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } } } }
  /api/kit/suite/sidebar:
    get:
      summary: The person's shared sidebar
      responses: { "200": { description: the sidebar, content: { application/json: { schema: { $ref: "#/components/schemas/Sidebar" } } } } }
    put:
      summary: Keep the person's order and hidden entries
      requestBody: { content: { application/json: { schema: { type: object, properties: { order: { type: array, items: { type: string } }, hidden: { type: array, items: { type: string } } } } } } }
      responses: { "200": { description: the sidebar, content: { application/json: { schema: { $ref: "#/components/schemas/Sidebar" } } } } }
  /api/kit/suite/search:
    get:
      summary: Search this app and every linked app at once
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 200 } }
        - { name: scope, in: query, schema: { type: string, enum: [all, self, others] } }
        - { name: apps, in: query, schema: { type: string, description: comma-separated app ids } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses: { "200": { description: one group per app, content: { application/json: { schema: { type: object, properties: { query: { type: string }, groups: { type: array, items: { $ref: "#/components/schemas/SearchGroup" } } } } } } } }
  /api/kit/sso:
    get:
      summary: Whether people sign in through an account source (public)
      responses: { "200": { description: sign-on, content: { application/json: { schema: { type: object, properties: { enabled: { type: boolean }, source: { type: [object, "null"] }, start: { type: [string, "null"] } } } } } } }
  /api/kit/sso/start:
    get:
      summary: Off to the account source to sign in
      parameters: [{ name: next, in: query, schema: { type: string } }]
      responses: { "303": { description: to the account source's authorization endpoint } }
  /api/kit/sso/callback:
    get:
      summary: The account source's answer; the app's session, or the sign-in page with sso_error
      parameters: [{ name: code, in: query, schema: { type: string } }, { name: state, in: query, schema: { type: string } }]
      responses: { "303": { description: to next, or to the sign-in page } }
  /.well-known/openid-configuration:
    get:
      summary: The account source's OIDC discovery document (404 unless it is one)
      responses: { "200": { description: discovery, content: { application/json: { schema: { type: object } } } } }
  /api/kit/oidc/authorize:
    get:
      summary: OIDC authorization (code flow); the client is a key's id
      parameters:
        - { name: response_type, in: query, required: true, schema: { type: string, const: code } }
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: nonce, in: query, schema: { type: string } }
      responses: { "303": { description: back with code and state, or to the sign-in page }, "400": { description: unknown client or redirect } }
  /api/kit/oidc/token:
    post:
      summary: A code for tokens (client_secret_post or client_secret_basic)
      requestBody: { content: { application/x-www-form-urlencoded: { schema: { type: object, properties: { grant_type: { type: string }, code: { type: string }, redirect_uri: { type: string }, client_id: { type: string }, client_secret: { type: string } } } } } }
      responses: { "200": { description: tokens, content: { application/json: { schema: { type: object, properties: { access_token: { type: string }, token_type: { type: string }, expires_in: { type: integer }, id_token: { type: string } } } } } }, "400": { description: invalid_grant }, "401": { description: invalid_client } }
  /api/kit/oidc/userinfo:
    get:
      summary: The claims for an access token
      responses: { "200": { description: claims, content: { application/json: { schema: { type: object } } } } }
