[workspace]
resolver = "2"
members = ["design/gen", "crates/*", "crates/kit-iced/demo", "crates/kit-leptos/demo"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Krifmaz/kit"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the server crates' dependencies
axum = { version = "0.8", features = ["multipart", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
rusqlite = { version = "0.37", features = ["bundled"] }
# kit-server-bugreports: attachments are sniffed and decoded, exports are zips, file names go into headers
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }
urlencoding = "2"
# kit-server-settings: reads settings.toml
toml = { version = "0.8.23", default-features = false, features = ["parse", "preserve_order"] }
futures-util = "0.3.34"
sha2 = "0.10"
kit-server-core = { path = "crates/kit-server-core" }
# pinned exactly: Leptos is before 1.0, so it is upgraded deliberately (DESIGN.md §10)
leptos = { version = "=0.8.23", default-features = false }

[workspace.lints.rust]
missing_docs = "warn"
