[workspace]
resolver = "2"
members = ["design/gen", "crates/kit-rules", "crates/kit-leptos", "crates/kit-leptos/demo"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Krifmaz/kit"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# pinned exactly: Leptos is before 1.0, so it is upgraded deliberately (DESIGN.md §10)
leptos = { version = "=0.8.23", default-features = false }

[workspace.lints.rust]
missing_docs = "warn"
