[workspace]
resolver = "2"
members = ["design/gen", "design/icons", "crates/*", "crates/kit-iced/demo", "crates/kit-leptos/demo"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Krifmaz/kit"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the server crates' dependencies
axum = { version = "0.8", features = ["multipart", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
rusqlite = { version = "0.39", features = ["bundled"] }
# kit-server-bugreports: attachments are sniffed and decoded, exports are zips, file names go into headers
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }
urlencoding = "2"
# kit-server-settings: reads settings.toml
toml = { version = "0.8.23", default-features = false, features = ["parse", "preserve_order"] }
futures-util = "0.3.34"
# kit-server-selfupdate: a Docker Engine client on the unix socket (HTTP/1.1 through hyper)
anyhow = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-util = { version = "0.7.20", features = ["io"] }
libc = "0.2"
sha2 = "0.10"
# kit-server-signup: invite and verification tokens
getrandom = "0.3"
kit-server-core = { path = "crates/kit-server-core" }
kit-rules = { path = "crates/kit-rules" }
kit-server-suite = { path = "crates/kit-server-suite" }
# kit-server-suite: asks linked apps (rustls on ring, so no C toolchain beyond cc is needed), signs ID tokens
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "charset", "http2"] }
hmac = "0.12"
base64 = "0.22"
rand = "0.9"
# the storage traits are async, so an app can keep the kit's data on an async database (Postgres through sqlx)
async-trait = "0.1.89"
# feature `postgres` of the server crates: the Postgres stores, on sqlx's core and Postgres driver (not the `sqlx`
# facade, whose optional SQLite driver links a second sqlite3 next to rusqlite's and can't resolve with it)
sqlx-core = { version = "=0.8.6", default-features = false, features = ["_rt-tokio", "json"] }
sqlx-postgres = { version = "=0.8.6", default-features = false, features = ["json"] }
# pinned exactly: Leptos is before 1.0, so it is upgraded deliberately (DESIGN.md §10)
leptos = { version = "=0.8.23", default-features = false }

[workspace.lints.rust]
missing_docs = "warn"
