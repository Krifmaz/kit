[workspace]
resolver = "2"
members = ["design/gen", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Krifmaz/kit"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the server crates: Encore's versions (server/Cargo.toml), so Encore builds one copy of each
axum = { version = "0.8", features = ["multipart", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
rusqlite = { version = "0.37", features = ["bundled"] }
# kit-server-bugreports: attachments are sniffed and decoded, exports are zips, file names go into headers
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }
urlencoding = "2"
kit-server-core = { path = "crates/kit-server-core" }

[workspace.lints.rust]
missing_docs = "warn"
