[package]
name = "{{project-name}}"
description = "{{app_title}}'s server: the API and the web app, one binary."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# the library is `server` in every app, so the Rust files need no app name (the binary keeps the package name)
[lib]
name = "server"
path = "src/lib.rs"

[dependencies]
kit-server-health = { workspace = true }
kit-server-changelog = { workspace = true }
kit-server-notices = { workspace = true }
kit-server-bugreports = { workspace = true }
kit-server-diagnostics = { workspace = true }
kit-server-settings = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
