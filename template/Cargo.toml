# {{app_title}}: the server (server/) and the web app (web/) in one Cargo workspace.
[workspace]
resolver = "2"
members = ["server", "web"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/{{github_owner}}/{{project-name}}"

# The kit, pinned to one release tag. To update: read the kit's CHANGELOG.md, bump the tag here, run the tests.
[workspace.dependencies]
kit-server-health = { git = "https://github.com/Krifmaz/kit", tag = "{{kit_tag}}" }
kit-server-changelog = { git = "https://github.com/Krifmaz/kit", tag = "{{kit_tag}}" }
kit-server-notices = { git = "https://github.com/Krifmaz/kit", tag = "{{kit_tag}}" }
kit-server-bugreports = { git = "https://github.com/Krifmaz/kit", tag = "{{kit_tag}}" }
kit-server-diagnostics = { git = "https://github.com/Krifmaz/kit", tag = "{{kit_tag}}" }
kit-server-settings = { git = "https://github.com/Krifmaz/kit", tag = "{{kit_tag}}" }
kit-rules = { git = "https://github.com/Krifmaz/kit", tag = "{{kit_tag}}" }
kit-leptos = { git = "https://github.com/Krifmaz/kit", tag = "{{kit_tag}}" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[workspace.lints.rust]
missing_docs = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
