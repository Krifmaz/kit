# cargo-generate settings for the kit's new-app template: `cargo generate krifmaz/kit template`.
# The answers below become Liquid variables; hooks/init.rhai fills in the ones derived from the app's name.
[template]
# 0.23.4: drops the `.liquid` of Cargo.toml.liquid in git templates too
cargo_generate_version = ">=0.23.4"
# Files copied as they are: no Liquid in them (Rust and CSS use `{{`/`{%` of their own; the Gradle wrapper is
# generated). Kotlin files are templated: they need the app's package (`package dev.krifmaz.<crate>`), so they
# must not contain `{{` or `{%` anywhere else.
exclude = ["web/static/**", "**/*.rs", "**/*.css", "android/gradlew", "android/gradlew.bat", "android/gradle/wrapper/gradle-wrapper.jar"]
# Files that describe the template itself, not the new app.
ignore = ["TEMPLATE.md", "hooks", "target"]

[hooks]
pre = ["hooks/init.rhai"]

[placeholders.app_title]
type = "string"
prompt = "The app's name as people see it (for example Filebrary)"
default = ""

[placeholders.github_owner]
type = "string"
prompt = "The GitHub owner of the new app's repository"
default = "Krifmaz"

[placeholders.kit_tag]
type = "string"
prompt = "The kit release to use"
default = "v0.8.0"

[placeholders.android]
type = "bool"
prompt = "Add the Android app (Compose, kit-compose, Baseline Profile and benchmark modules)?"
default = false

[conditional.'android == false']
ignore = ["android"]
